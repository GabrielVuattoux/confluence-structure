<h2>From arrival to release</h2><p>The diagram below shows the sequence followed at every warehouse.</p><svg viewBox="0 0 790 140" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="40" width="130" height="60" rx="8" fill="#eef2f7" stroke="#5b6b7f" /><text x="85" y="76" text-anchor="middle" font-family="sans-serif" font-size="14">Arrival</text><rect x="170" y="40" width="130" height="60" rx="8" fill="#eef2f7" stroke="#5b6b7f" /><text x="235" y="76" text-anchor="middle" font-family="sans-serif" font-size="14">Seal check</text><rect x="320" y="40" width="130" height="60" rx="8" fill="#eef2f7" stroke="#5b6b7f" /><text x="385" y="76" text-anchor="middle" font-family="sans-serif" font-size="14">Weigh</text><rect x="470" y="40" width="130" height="60" rx="8" fill="#eef2f7" stroke="#5b6b7f" /><text x="535" y="76" text-anchor="middle" font-family="sans-serif" font-size="14">Record</text><rect x="620" y="40" width="130" height="60" rx="8" fill="#eef2f7" stroke="#5b6b7f" /><text x="685" y="76" text-anchor="middle" font-family="sans-serif" font-size="14">Release</text><line x1="150" y1="70" x2="170" y2="70" stroke="#5b6b7f" /><line x1="300" y1="70" x2="320" y2="70" stroke="#5b6b7f" /><line x1="450" y1="70" x2="470" y2="70" stroke="#5b6b7f" /><line x1="600" y1="70" x2="620" y2="70" stroke="#5b6b7f" /></svg><p>Each step is described in <ac:link><ri:page ri:content-title="Receiving Checks by Warehouse" /></ac:link>.</p>
