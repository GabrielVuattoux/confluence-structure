[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "confluence-structure"
version = "0.1.0"
description = "Read Confluence storage-format exports without losing their structure"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "lxml>=5.3",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # Used only to confirm the reimplemented baselines in `comparison` behave the way the
    # real tools do. Not needed to use the library.
    "beautifulsoup4>=4.12",
    "html2text>=2024.2",
    "pandas>=2.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "lxml-stubs>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/confluence_structure"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D", "ANN"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
packages = ["confluence_structure"]
mypy_path = "src"
strict = true
